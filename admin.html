<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Vilar | الإدارة</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
  <!-- Connexion -->
  <main class="login" id="login" hidden>
    <div class="card">
      <h1>Vilar</h1>
      <form id="login-form" class="stack" novalidate>
        <div><label class="lbl" for="login-email">البريد الإلكتروني</label>
          <input class="field" id="login-email" type="email" autocomplete="username" dir="ltr"></div>
        <div><label class="lbl" for="login-pw">كلمة المرور</label>
          <input class="field" id="login-pw" type="password" autocomplete="current-password" dir="ltr"></div>
        <div class="msg err" id="login-msg" role="alert"></div>
        <button class="btn" id="login-go" type="submit">دخول</button>
      </form>
    </div>
  </main>

  <!-- Administration : les écrans s'affichent dans #app -->
  <div class="shell" id="shell" hidden>
    <aside id="side"></aside>
    <div class="content">
      <header id="top"></header>
      <main id="app"></main>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/admin/core.js"></script>
  <script src="assets/js/admin/dashboard.js"></script>
  <script src="assets/js/admin/orders.js"></script>
  <script src="assets/js/admin/invoice.js"></script>
  <script src="assets/js/admin/products.js"></script>
  <script src="assets/js/admin/product-edit.js"></script>
  <script src="assets/js/admin/categories.js"></script>
  <script src="assets/js/admin/delivery.js"></script>
  <script src="assets/js/admin/landing-pages.js"></script>
  <script src="assets/js/admin/landing-edit.js"></script>
  <script src="assets/js/admin/reviews.js"></script>
  <script src="assets/js/admin/settings.js"></script>
</body>
</html>
