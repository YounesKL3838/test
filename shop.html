<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vilar | المتجر</title>
  <meta name="description" content="Toutes les chaussures Vilar | جميع أحذية Vilar النسائية">
  <meta name="theme-color" content="#FAF7F2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Naskh+Arabic:wght@500;600&family=Tajawal:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <a class="skip" href="#main" data-i18n="skip"></a>
  <div id="announce"></div>
  <header id="site-header"></header>

  <main id="main">
    <div class="wrap">
      <div class="page-head"><h1 id="shop-title" data-i18n="nav_shop"></h1></div>
      <div class="shop">
        <aside class="filters" id="filters" aria-label="Filtres"></aside>
        <section>
          <div class="toolbar">
            <button class="btn btn-ghost filter-toggle" id="filter-toggle" type="button" aria-expanded="false" aria-controls="filters" data-i18n="f_show"></button>
            <span class="muted" id="count" role="status"></span>
            <label class="muted"><span data-i18n="sort"></span>
              <select id="sort">
                <option value="new" data-i18n="s_new"></option>
                <option value="asc" data-i18n="s_asc"></option>
                <option value="desc" data-i18n="s_desc"></option>
              </select>
            </label>
          </div>
          <div class="grid" id="grid"></div>
          <p class="empty" id="no-results" data-i18n="no_results" hidden></p>
        </section>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/shop.js"></script>
</body>
</html>
