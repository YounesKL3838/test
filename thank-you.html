<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vilar | تم استلام طلبك</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FAF7F2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Naskh+Arabic:wght@500;600&family=Tajawal:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <a class="skip" href="#main" data-i18n="skip"></a>
  <div id="announce"></div>
  <header id="site-header"></header>

  <main id="main">
    <div class="wrap">
      <section class="thanks">
        <div class="arch tick" aria-hidden="true"><span class="arch-word">✓</span></div>
        <h1 data-i18n="ty_title"></h1>
        <p class="muted" id="ty-dup" data-i18n="ty_dup" hidden></p>
        <dl class="ty-box">
          <div><dt data-i18n="ty_num"></dt><dd id="ty-num" dir="ltr"></dd></div>
          <div><dt data-i18n="ty_total"></dt><dd id="ty-total"></dd></div>
        </dl>
        <p data-i18n="ty_msg"></p>
        <a class="btn" href="shop.html" data-i18n="ty_more"></a>
      </section>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/ui.js"></script>
  <script>
    UI.init().then(function () {
      var q = new URLSearchParams(location.search);
      var num = q.get('o') || '', total = parseFloat(q.get('t'));
      if (!/^VL-\d{1,10}$/.test(num)) { location.replace('index.html'); return; }
      document.getElementById('ty-num').textContent = num;
      document.getElementById('ty-total').textContent = isFinite(total) ? I18N.money(total) : '';
      if (q.get('d') === '1') document.getElementById('ty-dup').hidden = false;
    });
  </script>
</body>
</html>
