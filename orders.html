<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Vilar | الطلبات</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="shell">
    <aside id="side"></aside>
    <div class="content">
      <header id="top"></header>
      <main id="app">
        <div class="page-title">
          <h1>الطلبات</h1>
          <button class="btn ghost" id="export" type="button">تصدير إلى Excel</button>
        </div>
        <div class="chips" id="chips" role="group" aria-label="الحالة"></div>

        <form class="filters" id="filters">
          <div><label class="lbl" for="q">بحث</label>
            <input class="field" id="q" type="search" placeholder="رقم الطلب، الهاتف أو الاسم"></div>
          <div><label class="lbl" for="wilaya">الولاية</label>
            <select class="field" id="wilaya"><option value="">الكل</option></select></div>
          <div><label class="lbl" for="source">المصدر</label>
            <select class="field" id="source"><option value="">الكل</option><option value="home">الصفحة الرئيسية</option><option value="landing">صفحات الهبوط</option></select></div>
          <div><label class="lbl" for="from">من تاريخ</label><input class="field" id="from" type="date"></div>
          <div><label class="lbl" for="to">إلى تاريخ</label><input class="field" id="to" type="date"></div>
          <button class="btn" type="submit">تطبيق</button>
        </form>

        <div class="tablewrap">
          <table>
            <thead><tr><th>الرقم</th><th>التاريخ</th><th>الزبونة</th><th>الهاتف</th><th>الولاية</th><th>المصدر</th><th>المجموع</th><th>الحالة</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="pager">
          <span class="muted" id="count"></span>
          <span><button class="btn ghost sm" id="prev" type="button">السابق</button>
          <button class="btn ghost sm" id="next" type="button">التالي</button></span>
        </div>
      </main>
    </div>
  </div>

  <dialog id="dlg">
    <div class="dlg-head"><h2 id="d-title"></h2><button class="btn ghost sm" id="d-close" type="button" aria-label="إغلاق">✕</button></div>
    <div class="dlg-body" id="d-body"></div>
  </dialog>
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
