<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vilar | إتمام الطلب</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FAF7F2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Naskh+Arabic:wght@500;600&family=Tajawal:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <a class="skip" href="#main" data-i18n="skip"></a>
  <div id="announce"></div>
  <header id="site-header"></header>

  <main id="main">
    <div class="wrap">
      <div class="page-head"><h1 data-i18n="k_title"></h1></div>
      <div class="checkout" id="checkout" hidden>
        <form id="order-form" novalidate>
          <div class="f">
            <label for="f-name" data-i18n="k_name"></label>
            <input class="field" id="f-name" name="fullname" autocomplete="name" maxlength="100">
            <div class="ferr" data-for="fullname" role="alert"></div>
          </div>
          <div class="f">
            <label for="f-phone" data-i18n="k_phone"></label>
            <input class="field" id="f-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" dir="ltr" placeholder="05XX XX XX XX">
            <div class="ferr" data-for="phone" role="alert"></div>
          </div>
          <div class="f">
            <label for="f-wilaya" data-i18n="k_wilaya"></label>
            <select class="field" id="f-wilaya" name="wilaya"></select>
            <div class="ferr" data-for="wilaya" role="alert"></div>
          </div>
          <div class="f">
            <label for="f-commune" data-i18n="k_commune"></label>
            <input class="field" id="f-commune" name="commune" autocomplete="address-level2" maxlength="100">
            <div class="ferr" data-for="commune" role="alert"></div>
          </div>
          <div class="f">
            <label for="f-address" data-i18n="k_address"></label>
            <textarea class="field" id="f-address" name="address" rows="2" autocomplete="street-address" maxlength="300"></textarea>
            <div class="ferr" data-for="address" role="alert"></div>
          </div>
          <fieldset class="f dtype">
            <legend data-i18n="k_dtype"></legend>
            <label class="opt"><input type="radio" name="dtype" value="home" checked> <span data-i18n="k_home"></span></label>
            <label class="opt"><input type="radio" name="dtype" value="desk"> <span data-i18n="k_desk"></span></label>
          </fieldset>
          <div class="f">
            <label for="f-notes" data-i18n="k_notes"></label>
            <textarea class="field" id="f-notes" name="notes" rows="2" maxlength="500"></textarea>
          </div>
          <div class="msg err" id="form-msg" role="alert"></div>
          <button class="btn btn-block" id="submit" type="submit" data-i18n="k_submit"></button>
        </form>
        <aside class="summary" id="summary" aria-label="Récapitulatif"></aside>
      </div>
      <div id="checkout-empty" hidden></div>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/checkout.js"></script>
</body>
</html>
