<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vilar</title>
  <meta name="description" content="Vilar">
  <meta name="theme-color" content="#FAF7F2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Naskh+Arabic:wght@500;600&family=Tajawal:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <a class="skip" href="#main" data-i18n="skip"></a>
  <div id="announce"></div>
  <header id="site-header"></header>

  <main id="main">
    <div class="wrap">
      <div class="product" id="product">
        <div class="gallery">
          <div class="gallery-main skeleton" id="g-main"></div>
          <div class="thumbs" id="thumbs"></div>
        </div>
        <div class="info" id="info"></div>
      </div>
    </div>
    <section class="section tint" id="sec-similar" hidden>
      <div class="wrap">
        <div class="sec-head"><h2 data-i18n="p_similar"></h2></div>
        <div class="grid" id="grid-similar"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/product.js"></script>
</body>
</html>
