<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Vilar | التوصيل</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="shell">
    <aside id="side"></aside>
    <div class="content">
      <header id="top"></header>
      <main id="app">
        <div class="page-title">
          <h1>أسعار التوصيل حسب الولاية</h1>
          <button class="btn" id="save" type="button">حفظ التغييرات</button>
        </div>
        <p class="muted">الولاية المعطّلة لا تظهر في نموذج الطلب. السعر 0 يعني توصيلاً مجانياً.</p>

        <div class="card">
          <h2>تطبيق سريع على كل الولايات</h2>
          <div class="row3" style="align-items:end">
            <div><label class="lbl" for="all-home">إلى المنزل (د.ج)</label><input class="field" id="all-home" type="number" min="0" dir="ltr"></div>
            <div><label class="lbl" for="all-desk">إلى المكتب (د.ج)</label><input class="field" id="all-desk" type="number" min="0" dir="ltr"></div>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <button class="btn ghost" id="apply-all" type="button">تطبيق الأسعار</button>
              <button class="btn ghost" id="on-all" type="button">تفعيل الكل</button>
              <button class="btn ghost" id="off-all" type="button">تعطيل الكل</button>
            </div>
          </div>
        </div>

        <div class="tablewrap">
          <table style="min-width:520px">
            <thead><tr><th>#</th><th>الولاية</th><th>إلى المنزل</th><th>إلى المكتب</th><th>مفعّلة</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/delivery.js"></script>
</body>
</html>
