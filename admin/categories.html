<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Vilar | التصنيفات</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="shell">
    <aside id="side"></aside>
    <div class="content">
      <header id="top"></header>
      <main id="app">
        <div class="page-title">
          <h1>التصنيفات</h1>
          <button class="btn" id="add" type="button">+ تصنيف جديد</button>
        </div>
        <p class="muted">«وصل حديثاً» و«التخفيضات» ليستا تصنيفات مخزّنة: تُحسبان تلقائياً من علامة «وصل حديثاً» ووجود سعر تخفيض.</p>
        <div class="tablewrap">
          <table>
            <thead><tr><th></th><th>التصنيف</th><th>الترتيب</th><th>ظاهر</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <dialog id="dlg">
    <div class="dlg-head"><h2 id="d-title">تصنيف</h2><button class="btn ghost sm" id="d-close" type="button" aria-label="إغلاق">✕</button></div>
    <form class="dlg-body" id="cform" novalidate>
      <div class="row2">
        <div><label class="lbl" for="name_ar">الاسم بالعربية *</label><input class="field" id="name_ar" maxlength="80"></div>
        <div><label class="lbl" for="name_fr">Nom en français *</label><input class="field" id="name_fr" maxlength="80" dir="ltr"></div>
      </div>
      <div class="row2">
        <div><label class="lbl" for="slug">الرابط (slug) *</label><input class="field" id="slug" maxlength="60" dir="ltr"></div>
        <div><label class="lbl" for="sort_order">الترتيب</label><input class="field" id="sort_order" type="number" step="1" value="0" dir="ltr"></div>
      </div>
      <div>
        <label class="lbl">الصورة</label>
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
          <img id="c-img" class="thumb" alt="" hidden style="width:64px;height:80px;object-fit:cover;border-radius:2px">
          <input type="file" id="c-file" accept="image/jpeg,image/png,image/webp" hidden>
          <button class="btn ghost sm" type="button" id="c-pick">اختيار صورة</button>
          <button class="btn ghost sm" type="button" id="c-clear" hidden>إزالة</button>
          <span class="muted" id="c-msg" role="status"></span>
        </div>
      </div>
      <label class="check"><input type="checkbox" id="is_active" checked> ظاهر في المتجر</label>
      <div class="msg" id="msg" role="alert"></div>
      <button class="btn" id="save" type="submit">حفظ</button>
    </form>
  </dialog>
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/categories.js"></script>
</body>
</html>
