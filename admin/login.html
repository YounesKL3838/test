<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Vilar | دخول الإدارة</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <main class="login">
    <div class="card">
      <h1>Vilar</h1>
      <form id="f" class="stack" novalidate>
        <div><label class="lbl" for="email">البريد الإلكتروني</label>
          <input class="field" id="email" type="email" autocomplete="username" dir="ltr" required></div>
        <div><label class="lbl" for="pw">كلمة المرور</label>
          <input class="field" id="pw" type="password" autocomplete="current-password" dir="ltr" required></div>
        <div class="msg err" id="msg" role="alert"></div>
        <button class="btn" id="go" type="submit">دخول</button>
      </form>
    </div>
  </main>
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script>
    var msg = document.getElementById('msg'), go = document.getElementById('go');
    if (!window.VILAR_CONFIGURED) msg.textContent = 'املأ ملف assets/js/config.js أولاً.';
    if (new URLSearchParams(location.search).get('e')) msg.textContent = 'هذا الحساب ليس مديراً.';

    // إذا كانت الجلسة صالحة ومديراً، ندخل مباشرة
    if (window.VILAR_CONFIGURED) {
      sb.auth.getSession().then(function (r) {
        if (!r.data.session) return;
        sb.rpc('is_admin').then(function (a) { if (a.data === true) location.replace('index.html'); });
      });
    }

    document.getElementById('f').addEventListener('submit', function (e) {
      e.preventDefault();
      if (!window.VILAR_CONFIGURED) return;
      msg.textContent = ''; go.disabled = true;
      sb.auth.signInWithPassword({
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('pw').value
      }).then(function (r) {
        if (r.error) { msg.textContent = 'البريد أو كلمة المرور غير صحيحة.'; go.disabled = false; return; }
        return sb.rpc('is_admin').then(function (a) {
          if (a.data === true) { location.replace('index.html'); return; }
          return sb.auth.signOut().then(function () { msg.textContent = 'هذا الحساب ليس مديراً.'; go.disabled = false; });
        });
      }).catch(function () { msg.textContent = 'تعذر الاتصال.'; go.disabled = false; });
    });
  </script>
</body>
</html>
