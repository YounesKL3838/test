<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Vilar | منتج</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="shell">
    <aside id="side"></aside>
    <div class="content">
      <header id="top"></header>
      <main id="app">
        <div class="page-title">
          <h1 id="title">منتج جديد</h1>
          <a class="btn ghost" href="products.html">← كل المنتجات</a>
        </div>

        <form id="pform" novalidate>
          <div class="card stack">
            <h2>المعلومات الأساسية</h2>
            <div class="row2">
              <div><label class="lbl" for="name_ar">الاسم بالعربية *</label><input class="field" id="name_ar" maxlength="150"></div>
              <div><label class="lbl" for="name_fr">Nom en français *</label><input class="field" id="name_fr" maxlength="150" dir="ltr"></div>
            </div>
            <div class="row2">
              <div><label class="lbl" for="slug">الرابط (slug) *</label><input class="field" id="slug" maxlength="120" dir="ltr" placeholder="sandale-beige"></div>
              <div><label class="lbl" for="category">التصنيف</label><select class="field" id="category"><option value="">— بدون —</option></select></div>
            </div>
            <div class="row2">
              <div><label class="lbl" for="desc_ar">الوصف بالعربية</label><textarea class="field" id="desc_ar" rows="4"></textarea></div>
              <div><label class="lbl" for="desc_fr">Description en français</label><textarea class="field" id="desc_fr" rows="4" dir="ltr"></textarea></div>
            </div>
          </div>

          <div class="card stack">
            <h2>السعر والعرض</h2>
            <div class="row2">
              <div><label class="lbl" for="price">السعر الأصلي (د.ج) *</label><input class="field" id="price" type="number" min="0" step="1" inputmode="numeric" dir="ltr"></div>
              <div><label class="lbl" for="sale_price">سعر التخفيض (اختياري)</label><input class="field" id="sale_price" type="number" min="0" step="1" inputmode="numeric" dir="ltr"></div>
            </div>
            <div style="display:flex;gap:22px;flex-wrap:wrap">
              <label class="check"><input type="checkbox" id="is_active" checked> ظاهر في المتجر</label>
              <label class="check"><input type="checkbox" id="is_new"> وصل حديثاً</label>
              <label class="check"><input type="checkbox" id="is_bestseller"> الأكثر مبيعاً</label>
              <label class="check"><input type="checkbox" id="is_featured"> مميز</label>
            </div>
          </div>

          <div class="card">
            <h2>المقاسات والألوان والمخزون</h2>
            <div class="row3" style="align-items:end;margin-bottom:14px">
              <div><label class="lbl" for="g-color">اللون</label><input class="field sm" id="g-color" placeholder="Beige"></div>
              <div><label class="lbl" for="g-hex">درجة اللون</label><input class="field sm" id="g-hex" type="color" value="#d9c7b0" style="padding:2px;width:70px"></div>
              <div></div>
            </div>
            <div class="row3" style="align-items:end;margin-bottom:14px">
              <div><label class="lbl" for="g-from">من المقاس</label><input class="field sm" id="g-from" type="number" min="1" max="60" value="36" dir="ltr"></div>
              <div><label class="lbl" for="g-to">إلى المقاس</label><input class="field sm" id="g-to" type="number" min="1" max="60" value="41" dir="ltr"></div>
              <div><label class="lbl" for="g-stock">الكمية لكل مقاس</label><input class="field sm" id="g-stock" type="number" min="0" value="5" dir="ltr"></div>
            </div>
            <button class="btn ghost sm" type="button" id="g-add">توليد المقاسات لهذا اللون</button>
            <button class="btn ghost sm" type="button" id="v-add">+ سطر يدوي</button>
            <div class="tablewrap" style="margin-top:14px">
              <table class="vtable" style="min-width:560px">
                <thead><tr><th>المقاس</th><th>اللون</th><th>درجة</th><th>الكمية</th><th>مفعّل</th><th></th></tr></thead>
                <tbody id="vbody"></tbody>
              </table>
            </div>
          </div>

          <div class="msg" id="msg" role="alert"></div>
          <button class="btn" type="submit" id="save">حفظ المنتج</button>
        </form>

        <div class="card" id="img-card" style="margin-top:18px">
          <h2>الصور</h2>
          <p class="muted" id="img-hint">احفظ المنتج أولاً ثم ارفع صوره.</p>
          <div id="img-tools" hidden>
            <input type="file" id="files" accept="image/jpeg,image/png,image/webp" multiple hidden>
            <button class="btn ghost sm" type="button" id="pick">+ رفع صور</button>
            <span class="muted" id="up-msg" role="status"></span>
            <p class="muted" style="margin:8px 0 14px">تُضغط الصور تلقائياً قبل الرفع. أول صورة هي الصورة الرئيسية.</p>
            <div class="imgs" id="imgs"></div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/product-edit.js"></script>
</body>
</html>
