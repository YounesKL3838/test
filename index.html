<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Vilar | الإحصائيات</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="shell">
    <aside id="side"></aside>
    <div class="content">
      <header id="top"></header>
      <main id="app">
        <div class="page-title">
          <h1>الإحصائيات</h1>
          <select class="field" id="period" style="width:auto" aria-label="الفترة">
            <option value="today">اليوم</option>
            <option value="7">آخر 7 أيام</option>
            <option value="30" selected>آخر 30 يوماً</option>
            <option value="month">هذا الشهر</option>
            <option value="all">الكل</option>
          </select>
        </div>
        <div class="kpis" id="kpis"></div>
        <div class="row2">
          <div class="card"><h2>الطلبات حسب الحالة</h2><div class="bars" id="bars"></div></div>
          <div class="card"><h2>أكثر المنتجات طلباً</h2><div id="top-products"></div></div>
        </div>
        <div class="card" id="lp-card" hidden><h2>صفحات الهبوط</h2>
          <div class="tablewrap"><table><thead><tr><th>الصفحة</th><th>الزيارات</th><th>الطلبات</th><th>التحويل</th></tr></thead><tbody id="lp-body"></tbody></table></div>
        </div>
        <div class="card"><h2>آخر الطلبات</h2>
          <div class="tablewrap"><table><thead><tr><th>الرقم</th><th>التاريخ</th><th>الزبونة</th><th>الولاية</th><th>المجموع</th><th>الحالة</th></tr></thead><tbody id="recent"></tbody></table></div>
        </div>
      </main>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
